        } else {
            args = [project.properties.get('inputModel', 'src/test/resources/valid/behavior_trees/DemonstratorLLSubtrees.bt'),
                    project.properties.get('outputName', '../APTreeExecutionEngine/src/ModelLoader/LLSubtrees.json')]
        }
    }
}

// ═══════════════════════════════════════════════════════════════════════════
// UNIFIED TASK: Generate ALL JSON files for a behavior tree by convention
//
// Usage:  gradle generateAll "-PtreeName=Demonstrator"
//
// Convention (all in src/test/resources/valid/):
//   behavior_trees/{treeName}.bt             → BT model
//   CRFConcrete/{treeName}SceneObjects.bt    → setup objects / scene instances
//   CRFConcrete/{treeName}InitState.bt       → initial state predicates
//   CRFConcrete/{treeName}GoalState.bt       → goal state predicates
//
// Outputs (in ../APTreeExecutionEngine/src/ModelLoader/):
//   BehaviorTreeModel.json
//   {treeName}SetupObjects.json
//   {treeName}InitState.json
//   {treeName}GoalState.json
//   {treeName}LLSubtrees.json   (if {treeName}LLSubtrees.bt exists)
// ═══════════════════════════════════════════════════════════════════════════
task generateAll {
    description = 'Generates all JSON files for a tree: BT model + SceneObjects + InitState + GoalState'
    dependsOn 'compileJava'

    doLast {
        if (!project.hasProperty('treeName')) {
            throw new GradleException(
                "Usage: gradle generateAll -PtreeName=<TreeName>\n" +
                "Example: gradle generateAll -PtreeName=Demonstrator")
        }

        String tn = project.property('treeName')
        String btModel      = "src/test/resources/valid/behavior_trees/${tn}.bt"
        String sceneObjects  = "src/test/resources/valid/CRFConcrete/${tn}SceneObjects.bt"
        String initState     = "src/test/resources/valid/CRFConcrete/${tn}InitState.bt"
        String goalState     = "src/test/resources/valid/CRFConcrete/${tn}GoalState.bt"

        // ── Pre-flight: check all DSL model files exist ──
        def requiredFiles = [
            'BT model'      : btModel,
            'SceneObjects'   : sceneObjects,
            'InitState'      : initState,
            'GoalState'      : goalState
        ]
        def missing = []
        requiredFiles.each { label, path ->
            if (!file(path).exists()) {
                missing << "  [MISSING] ${label}: ${path}"
            } else {
                println "[OK] Found ${label}: ${path}"
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "Cannot generate for tree '${tn}'. Missing DSL files:\n" +
                missing.join('\n') + "\n\n" +
                "Expected naming convention:\n" +
                "  behavior_trees/${tn}.bt\n" +
                "  CRFConcrete/${tn}SceneObjects.bt\n" +
                "  CRFConcrete/${tn}InitState.bt\n" +
                "  CRFConcrete/${tn}GoalState.bt")
        }

        println "\n════════════════════════════════════════════"
        println " Generating all JSON for: ${tn}"
        println "════════════════════════════════════════════\n"

        // ── 1. SceneObjects → {treeName}SetupObjects.json ──
        println "── [1/5] SceneObjects ──"
        javaexec {
            classpath = sourceSets.main.runtimeClasspath
            mainClass = 'GeneratorJsonSetupObjects'
            args = [tn]
        }

        // ── 2. InitialState → {treeName}InitState.json ──
        println "\n── [2/5] InitialState ──"
        javaexec {
            classpath = sourceSets.main.runtimeClasspath
            mainClass = 'InitialStateJsonGenerator'
            args = [tn]
        }

        // ── 3. GoalState → {treeName}GoalState.json ──
        println "\n── [3/5] GoalState ──"
        javaexec {
            classpath = sourceSets.main.runtimeClasspath
            mainClass = 'GoalStateJsonGenerator'
            args = [tn]
        }

        // ── 4. BT Model → BehaviorTreeModel.json ──
        println "\n── [4/5] BT Model ──"
        javaexec {
            classpath = sourceSets.main.runtimeClasspath
            mainClass = 'BTInstanceJsonGenerator'
            args = [btModel, sceneObjects,
                    "../APTreeExecutionEngine/src/ModelLoader/BehaviorTreeModel.json"]
        }

        // ── 5. LL Subtrees → {treeName}LLSubtrees.json ──
        String llSubtrees = "src/test/resources/valid/behavior_trees/${tn}LLSubtrees.bt"
        if (file(llSubtrees).exists()) {
            println "\n── [5/5] LL Subtrees ──"
            javaexec {
                classpath = sourceSets.main.runtimeClasspath
                mainClass = 'LLSubtreeJsonGenerator'
                args = [llSubtrees,
                        "../APTreeExecutionEngine/src/ModelLoader/${tn}LLSubtrees.json"]
            }
        } else {
            println "\n── [5/5] LL Subtrees ── (skipped: ${llSubtrees} not found)"
        }

        println "\n════════════════════════════════════════════"
        println " Done! All JSON files generated for: ${tn}"
        println "════════════════════════════════════════════"
    }
}

defaultTasks 'build'
