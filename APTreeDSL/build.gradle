task runCRFPredicateTypeParser(type: JavaExec) {
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'CRFPredicateTypeParser'
    workingDir = projectDir
}


task runCRFActionTypeParser(type: JavaExec) {
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'CRFActionTypeParser'
    workingDir = projectDir
}

task generateCRFPropertyTypeRules(type: JavaExec) {
    description = 'Generates grammar rules for CRFTypesCon.mc4 from CRFPropertyTypes.bt'
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'CRFPropertyTypeRuleGenerator'
    workingDir = projectDir
    args = [project.properties.get('inputModel', 'src/test/resources/valid/CRFTypes/LiveMatPropertyTypes.bt')]
}

task generateCRFActionTypeRules(type: JavaExec) {
   description = 'Generates action type grammar rules for CRFTypesCon.mc4 from CRFActionTypes.bt'
   dependsOn 'compileJava'
   classpath = sourceSets.main.runtimeClasspath
   mainClass = 'CRFActionTypeRuleGenerator'
   workingDir = projectDir
   args = [project.properties.get('inputModel', 'src/test/resources/valid/CRFTypes/LiveMatActionTypes.bt')]
}

task generateCRFPredicateTypeRules(type: JavaExec) {
    description = 'Generates predicate grammar rules for CRFTypesCon.mc4 from CRFPredicateTypes.bt'
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'CRFPredicateTypeRuleGenerator'
    workingDir = projectDir
    args = [project.properties.get('inputModel', 'src/test/resources/valid/CRFTypes/LiveMatPredicaetTypes.bt')]
}



task runCRFConPropertyParser(type: JavaExec) {
    description = 'Parses concrete property instances (CRFTypesCon grammar)'
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'CRFConPropertyParser'
    workingDir = projectDir
    args = [project.properties.get('modelName', 'LiveMatSetupObjects.bt')]
}

task runCRFConPredicateParser(type: JavaExec) {
    description = 'Parses predicate models (CRFTypesCon grammar)'
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'CRFConPredicateParser'
    workingDir = projectDir
    args = [project.properties.get('modelName', 'LiveMatInitialState.bt')]
}

task runInitialStateJsonGenerator(type: JavaExec) {
  description = 'Parses predicate model and exports JSON'
  dependsOn 'compileJava'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'InitialStateJsonGenerator'
  workingDir = projectDir
  args = [project.properties.get('modelName', 'LiveMatInitialState.bt'),
      project.properties.get('outputName', '../APTreeExecutionEngine/src/ModelLoader/InitialStatePredicates.json')]
}

task runAPTreeTool(type: JavaExec) {
    description = 'Parses and analyzes the APTree behavior tree model'
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'APTreeTool'
    workingDir = projectDir
}

task runConcreteBTInstanceParser(type: JavaExec) {
    description = 'Parses CRF Concrete Instance definitions (Beam, Robot, etc.)'
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ConcreteBTInstanceParser'
    workingDir = projectDir
}

task runBTModelParser(type: JavaExec) {
    description = 'Parses a BehaviorTree .bt model using the BehaviorTree grammar'
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'BehaviorTreeModelParser'
    workingDir = projectDir
    args = [project.properties.get('modelName', 'BehaviorTree.bt')]
}

task runAPTreeModelParser(type: JavaExec) {
    description = 'Parses an APTree .bt model using the DynamicBTFlowNode grammar'
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'APTreeModelParser'
    workingDir = projectDir
    args = [project.properties.get('modelName', 'APTreeLiveMat.bt')]
}

task generateInstanceSymbols(type: JavaExec) {
  description = 'Generates .sym files for each Element from CRFConcreteInstances.bt'
  dependsOn 'compileJava'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'InstanceSymbolsGenerator'
  workingDir = projectDir
}

task runLiveMatSetupObjectsGenerator(type: JavaExec) {
    description = 'Parses LiveMatSetupObjects.bt and generates JSON file with parameter instances'
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'LiveMatSetupObjectsGenerator'
    workingDir = projectDir
    args = ['src/test/resources/valid/CRFConcrete/LiveMatSetupObjects.bt',
        '../APTreeExecutionEngine/src/ModelLoader/LiveMatSetupObjects.json']
}

task generateBTModelJson(type: JavaExec) {
    description = 'Parses APTree BT model and exports full tree structure as JSON for the C# execution engine'
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'BTInstanceJsonGenerator'
    workingDir = projectDir
    args = [
        project.properties.get('btModel', 'src/test/resources/valid/behavior_trees/APTreeLiveMat.bt'),
        project.properties.get('instances', 'src/test/resources/valid/CRFConcrete/LiveMatSetupObjects.bt'),
        project.properties.get('outputName', '../APTreeExecutionEngine/src/ModelLoader/BehaviorTreeModel.json')
    ]
}

// Task to generate Class Diagram from grammar (shows AST structure)
task generateASTClassDiagram(type: JavaExec) {
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ASTClassDiagramGenerator'
    workingDir = projectDir
}

defaultTasks 'build'
