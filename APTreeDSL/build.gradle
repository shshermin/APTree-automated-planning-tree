///// generating grammar rules for new types
// These tasks read the type definitions from the .bt files and generate corresponding grammar rules for the CRFTypesCon.mc4 grammar, which is used to parse concrete instances of these types in the .bt models. This way, when new types are added to the .bt files, we can easily update the grammar rules by running these tasks.
// example command: gradle generateCRFPropertyTypeRules -PinputModel="src/test/resources/valid/CRFTypes/DemonstratorPropertyTypes.bt" 

