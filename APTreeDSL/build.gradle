/// Generating Json Files

// Task to generate JSON file with parameter instances for the execution engine
// Convention mode: gradle runObjectsJsonGenerator -PtreeName=Demonstrator
// Legacy mode:     gradle runObjectsJsonGenerator -PmodelName=... -PoutputName=...
task runObjectsJsonGenerator(type: JavaExec) {
    description = 'Parses {treeName}SceneObjects.bt and generates {treeName}SetupObjects.json'
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'GeneratorJsonSetupObjects'
    workingDir = projectDir
    doFirst {
        if (project.hasProperty('treeName')) {
            args = [project.property('treeName')]
        } else {
            args = [project.properties.get('modelName', 'src/test/resources/valid/CRFConcrete/LiveMatSceneObjects.bt'),
                project.properties.get('outputName', '../APTreeExecutionEngine/src/ModelLoader/LiveMatSetupObjects.json')]
        }
    }
}

